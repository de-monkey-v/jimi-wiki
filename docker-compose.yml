name: jimi-wiki-app

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: jimi-wiki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jimi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: jimi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jimi-wiki-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jimi -d jimi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 자가호스팅 임베딩(bge-m3). EMBED_PROVIDER=local 일 때 web·worker 가 여기로 임베딩을 보낸다.
  # → 임베딩에 외부 API 키가 필요 없어진다. gemini 로 되돌리려면 .env 에서 EMBED_PROVIDER=gemini 로
  #   바꾸고 재색인만 하면 된다(벡터 차원 1024 로 통일돼 있어 스키마 변경 불필요).
  #
  # ⚠️ GPU 필요: NVIDIA 드라이버 + nvidia-container-toolkit 이 있어야 한다(CUDA 12.2+).
  #    이미지 태그는 GPU 아키텍처별로 다르다 — 86 = Ampere consumer(RTX 30xx). 다른 GPU 는
  #    text-embeddings-inference README 의 "Supported models and hardware" 표를 볼 것.
  #    GPU 가 없으면 이 서비스를 지우고 EMBED_PROVIDER=gemini 로 쓰면 된다.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9
    container_name: jimi-wiki-embeddings
    restart: unless-stopped
    # 서빙 모델은 .env 의 EMBED_MODEL 이 정한다(앱이 계측에 쓰는 라벨과 같은 값 — 단일 소스).
    # 한국어 위주면 nlpai-lab/KURE-v1(bge-m3 한국어 파인튜닝, 1024차원 동일) 을 권장한다.
    # ⚠️ EMBED_PROVIDER=gemini 로 쓸 때는 이 서비스를 띄우지 말 것(EMBED_MODEL 이 gemini 모델명이 된다).
    command: ["--model-id", "${EMBED_MODEL:-BAAI/bge-m3}", "--auto-truncate"]
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    ports:
      # 컨테이너 밖(호스트에서 pnpm dev 로 띄운 web·worker)에서도 쓰도록 게시.
      # 컨테이너끼리는 http://embeddings:80 을 쓴다(EMBED_BASE_URL 참고).
      - "127.0.0.1:8080:80"
    volumes:
      # 모델 가중치 캐시(수 GB) — 없으면 컨테이너를 새로 만들 때마다 다시 받는다.
      - jimi-embed-models:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  jimi-wiki-pgdata:
  jimi-embed-models:
