name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: jimi
          POSTGRES_PASSWORD: jimi
          POSTGRES_DB: jimi
        ports:
          # 5434 = 개발 DB 포트 계약 — scripts/run-dev-db-command.mjs 가드가 loopback:5434/jimi만 허용
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U jimi -d jimi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jimi:jimi@localhost:5434/jimi?schema=public
      AUTH_SECRET: ci-secret
      GEMINI_API_KEY: ""
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      DEV_USER_EMAIL: dev@jimi.local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm check:rules
      - run: pnpm check:i18n
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm smoke
      - run: pnpm build
