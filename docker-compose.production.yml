name: jimi-wiki-app

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: jimi-wiki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jimi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: jimi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jimi-wiki-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jimi -d jimi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 운영 자가호스팅 임베딩. web·worker는 host loopback의 8080으로 접근한다.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9
    container_name: jimi-wiki-embeddings
    restart: unless-stopped
    command: ["--model-id", "${EMBED_MODEL:-BAAI/bge-m3}", "--auto-truncate"]
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - jimi-embed-models:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  jimi-wiki-pgdata:
  jimi-embed-models:
