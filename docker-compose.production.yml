name: jimi-wiki-app

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: jimi-wiki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jimi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: jimi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jimi-wiki-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jimi -d jimi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 운영 자가호스팅 임베딩. web·worker는 host loopback의 EMBED_HOST_PORT(기본 8080)로 접근한다.
  # 호스트 포트를 설정값으로 둔 이유: 기본 8080은 흔한 번호라 같은 머신의 다른 서비스와
  # 부딪힌다. 그때 이 값만 옮기면 되고, app.env의 EMBED_BASE_URL·health-check가 함께 따라간다.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9
    container_name: jimi-wiki-embeddings
    restart: unless-stopped
    command: ["--model-id", "${EMBED_MODEL:-BAAI/bge-m3}", "--auto-truncate"]
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    ports:
      - "127.0.0.1:${EMBED_HOST_PORT:-8080}:80"
    volumes:
      - jimi-embed-models:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  jimi-wiki-pgdata:
  jimi-embed-models:
